# secure-debian-bootstrap defaults.
#
# This file is READ AS DATA, never sourced. Only KEY=VALUE lines with known
# keys are accepted; anything else is ignored with a warning. That is
# deliberate: a configuration file must never be able to execute code.

# Minimum platform-detection confidence (0-100) required before any
# modifying stage will run.
SDB_MIN_CONFIDENCE=70

# Where runs, backups, and quarantine are stored.
# Non-Termux default: /var/lib/secure-debian-bootstrap
# Termux default:     $PREFIX/var/lib/secure-debian-bootstrap
# SDB_STATE_DIR=/var/lib/secure-debian-bootstrap

# Skip the network portion of staged validation. Setting this means the staged
# configuration is NOT proven to fetch and verify; use it knowingly.
SDB_NO_NETWORK=0

# Allow activation of templates whose repository facts could not be verified
# against a vendor-primary source (currently: debian, mx-linux).
SDB_ALLOW_SECONDARY_TEMPLATE=0

# Allow EOL releases to be repaired against archive repositories.
SDB_USE_ARCHIVE_REPOSITORIES=0

# Parrot: write the backports entry enabled rather than commented out.
SDB_PARROT_ENABLE_BACKPORTS=0
